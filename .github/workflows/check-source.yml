name: Check source branch

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: develop 브랜치에서 온 PR인지 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "main에는 develop 브랜치의 PR만 허용합니다. (현재: $HEAD_REF)"
            exit 1
          fi
